<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/styles.css" rel="stylesheet" />
    <link href="../css/ejercicio2.css" rel="stylesheet" />
    <link rel="icon" href="../img/js.png" sizes="32x32" type="image/png" />
    <title>Catálogo de juegos gratuitos - Fetch API</title>
</head>

<body>

    <header class="p-3 text-bg-dark">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="../../index.html" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                    <img src="../img/js.png" class="bi me-2" width="48" height="48" alt="JS">
                </a>

                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="../pages/ejemplo1.html" class="nav-link px-2 text-white">Ejemplo 1</a></li>
                    <li><a href="../pages/ejemplo2.html" class="nav-link px-2 text-white">Ejemplo 2</a></li>
                    <li><a href="../pages/ejemplo3.html" class="nav-link px-2 text-white">Ejemplo 3</a></li>
                    <li><a href="../pages/ejemplo4.html" class="nav-link px-2 text-white">Ejemplo 4</a></li>
                    <li><a href="../pages/ejercicio1.html" class="nav-link px-2 text-white">Ejercicio 1</a></li>
                    <li><a href="../pages/ejercicio2.html" class="nav-link px-2 text-warning fw-bold">
                            <i class="bi bi-check"></i> Ejercicio 2
                        </a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container py-5">
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold"><i class="bi bi-controller"></i> Catálogo de juegos gratuitos</h1>
            <p class="lead text-body-secondary">
                Consumo de la API <strong>Free-to-Play Games Database</strong> (RapidAPI) con Fetch API y async/await.
            </p>
        </div>

        <form id="idFrmFiltros" class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
                <label for="idCmbPlataforma" class="form-label fw-bold">Plataforma</label>
                <select id="idCmbPlataforma" class="form-select">
                    <option value="all">Todas</option>
                    <option value="pc">PC (Windows)</option>
                    <option value="browser">Navegador</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="idCmbCategoria" class="form-label fw-bold">Categoría</label>
                <select id="idCmbCategoria" class="form-select">
                    <option value="">Todas</option>
                    <option value="mmorpg">MMORPG</option>
                    <option value="shooter">Shooter</option>
                    <option value="strategy">Estrategia</option>
                    <option value="moba">MOBA</option>
                    <option value="racing">Carreras</option>
                    <option value="sports">Deportes</option>
                    <option value="social">Social</option>
                    <option value="card">Cartas</option>
                    <option value="fighting">Pelea</option>
                    <option value="battle-royale">Battle Royale</option>
                    <option value="fantasy">Fantasía</option>
                    <option value="anime">Anime</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="idCmbOrden" class="form-label fw-bold">Ordenar por</label>
                <select id="idCmbOrden" class="form-select">
                    <option value="popularity">Popularidad</option>
                    <option value="release-date">Fecha de lanzamiento</option>
                    <option value="alphabetical">Alfabético</option>
                    <option value="relevance">Relevancia</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100" id="idBtnBuscar">
                    <i class="bi bi-search"></i> Consultar
                </button>
            </div>
            <div class="col-md-2">
                <label for="idTxtFiltro" class="form-label fw-bold">Buscar en resultados</label>
                <input type="search" id="idTxtFiltro" class="form-control" placeholder="Nombre del juego">
            </div>
        </form>

        <div id="idEstado" aria-live="polite"></div>

        <p id="idResumen" class="text-body-secondary small"></p>
        <div id="idListado" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
    </main>

    <div class="modal fade" id="idModalDetalle" tabindex="-1" aria-labelledby="idTituloDetalle" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="idTituloDetalle">Detalle del juego</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="idBodyDetalle"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle"></i> Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/ejercicio2.js" defer></script>
</body>

</html>
